# Simple workflow for deploying static content to GitHub Pages
name: Deploy

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ['main']

  repository_dispatch:
    types: [dispatch-event]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets the GITHUB_TOKEN permissions to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Install pnpm
        run: npm install -g pnpm
        shell: bash

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build && cp ./dist/index.html ./dist/404.html

      # Restores the previous deployment's totals so the size report can show a
      # delta. The exact key never hits (it carries this run's sha), so the
      # restore-key prefix picks up the most recent cache instead; the new totals
      # are saved under this run's key when the job finishes. A miss — first run,
      # or a cache aged out after 7 days — just means no delta.
      - name: Restore previous build size
        uses: actions/cache@v4
        with:
          path: .build-size.json
          key: build-size-${{ github.sha }}
          restore-keys: |
            build-size-

      # Observability only — a failure here must never hold up a deployment, but
      # it should still be visible in the run rather than swallowed.
      - name: Report build size
        run: pnpm run size
        continue-on-error: true

      - name: Setup Pages
        uses: actions/configure-pages@v3

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload dist repository
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
